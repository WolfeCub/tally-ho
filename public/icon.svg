<!-- Source for the PNG icons. Regenerate with resvg, passing width and height.
     Tally marks, legible down to favicon size. The glyph stays well inside the
     central 80% so it survives a maskable crop. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#16181a"/>
  <g stroke="#e8e6e3" stroke-width="26" stroke-linecap="round">
    <line x1="176" y1="176" x2="176" y2="336"/>
    <line x1="228" y1="176" x2="228" y2="336"/>
    <line x1="280" y1="176" x2="280" y2="336"/>
    <line x1="332" y1="176" x2="332" y2="336"/>
    <line x1="156" y1="344" x2="352" y2="168"/>
  </g>
</svg>
