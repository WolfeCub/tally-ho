[package]
name = "tally-ho"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `multipart` enables `#[server(input = MultipartFormData)]` for the photo upload.
leptos = { version = "0.8", features = ["multipart"] }
leptos_router = "0.8"
leptos_meta = "0.8"

# Shared: these appear in DTOs that cross the wire, so they compile for wasm32.
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
rust_decimal = { version = "1.41", features = ["serde"] }
# Currency symbols and minor units for display.
iso_currency = "0.5"
# No `v4`/`v7`: the client only parses ids, and a version feature would demand a
# wasm randomness source.
uuid = { version = "1", features = ["serde"] }

# Server-only, hence `optional` + the `ssr` feature below. Most of these will not
# build for wasm32 at all.
toasty = { version = "0.9", features = ["sqlite", "jiff", "rust_decimal", "serde", "migration"], optional = true }
toasty-cli = { version = "0.9", optional = true }
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"], optional = true }
serde_json = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

rig-core = { version = "0.41", optional = true }
rig-agent = { version = "0.41", optional = true }
# Must stay on the same major as rig's own schemars, or our `JsonSchema` impls
# are a different trait than `output_schema::<T>()` wants.
schemars = { version = "1.0", optional = true }
# Default features include webp, which phone photos arrive as.
image = { version = "0.25", optional = true }
kamadak-exif = { version = "0.6", optional = true }
base64 = { version = "0.22", optional = true }

# Client-only.
console_error_panic_hook = { version = "0.1", optional = true }
# Pinned exactly: the wasm-bindgen CLI cargo-leptos runs must match this crate,
# and nixpkgs' cargo-leptos is built with `no_downloads` so it cannot fetch a
# matching one. Bump `wasm-bindgen-cli_0_2_126` in flake.nix in the same commit.
wasm-bindgen = { version = "=0.2.126", optional = true }

[features]
# Neither is default on purpose: the lib is built twice, once per target, and a
# default would silently pull server deps into the wasm bundle.
default = []
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:toasty",
    "dep:toasty-cli",
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:serde_json",
    "dep:async-trait",
    "dep:anyhow",
    "dep:thiserror",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:rig-core",
    "dep:rig-agent",
    "dep:schemars",
    "dep:image",
    "dep:kamadak-exif",
    "dep:base64",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

# Everything cargo-leptos already defaults to is omitted: site-root, site-pkg-dir,
# site-addr, reload-port, browserquery. `bin-default-features`/`lib-default-features`
# are omitted too — with `default = []` there are no default features to turn off.
[package.metadata.leptos]
# Underscored, and not the default: it would otherwise be the package name,
# `tally-ho`, but the bundle is referenced as /pkg/tally_ho.css.
output-name = "tally_ho"
# Required because there are other bin targets (migrate, extract_probe).
bin-target = "tally-ho"
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
assets-dir = "public"
# Tailwind v4 is CSS-first. `tailwind-config-file` is deliberately omitted:
# cargo-leptos only passes `--config` when it is set, and would generate a
# v3-style tailwind.config.js if the path didn't exist.
tailwind-input-file = "style/tailwind.css"
