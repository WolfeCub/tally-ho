name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # nix-quick-install rather than install-nix-action: it's what
      # cache-nix-action is built against, and it needs the keep-* settings so GC
      # doesn't drop the things we're caching.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      # A runner starts with ~14GB free, and the nix store for this build wants
      # more. These are the biggest preinstalled things we never touch.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Cache the nix store
        id: cache
        uses: nix-community/cache-nix-action@v7
        with:
          # Keyed on the lockfiles, so a source-only change still reuses the
          # cached dependency build — nearly all of the ~700 crates.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # No gc-max-store-size on purpose: any number here would be a guess, and
          # trimming to leave room for several entries only helps if we need
          # several. A source-only change reuses this key, so usually one complete
          # entry is the whole point. Set a limit if the sizes logged below get
          # near GitHub's 10GB-per-repo cap.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Cache state
        run: |
          echo "hit=${{ steps.cache.outputs.hit }}" \
               "primary=${{ steps.cache.outputs.hit-primary-key }}" \
               "first-match=${{ steps.cache.outputs.hit-first-match }}"
          echo "restored key: '${{ steps.cache.outputs.restored-key }}'"
          echo "store: $(du -sh /nix/store | cut -f1) in $(find /nix/store -mindepth 1 -maxdepth 1 | wc -l) paths"

      # The derivation's check phase runs the test suite, so this covers both.
      - name: Build image
        run: nix build .#image -L

      # The size heading into the save. It is NOT the saved size: the GC and the
      # upload happen in cache-nix-action's post step, which runs after every step
      # here — those numbers are at the very end of the job log, under the
      # action's own "Post Cache the nix store".
      - name: Store size before save
        run: |
          echo "store: $(du -sh /nix/store | cut -f1) in $(find /nix/store -mindepth 1 -maxdepth 1 | wc -l) paths"
          df -h / | tail -1
          echo "--- 15 largest paths ---"
          du -sh /nix/store/* 2>/dev/null | sort -rh | head -15

      - name: Push to ghcr.io
        if: github.ref_name == github.event.repository.default_branch
        run: |
          # The runner ships a v1 /etc/containers/registries.conf, which the
          # skopeo from nixpkgs refuses to load. Point it at a v2 one instead.
          printf 'unqualified-search-registries = ["docker.io"]\n' > "$RUNNER_TEMP/registries.conf"
          export CONTAINERS_REGISTRIES_CONF="$RUNNER_TEMP/registries.conf"

          # ghcr rejects uppercase, and owner names can have it.
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # copyTo, not copyToRegistry — the latter hardcodes the destination to
          # the image's own name:tag, which isn't a registry path.
          for tag in "${{ github.sha }}" latest; do
            nix run .#image.copyTo -- \
              "docker://$image:$tag" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          done
