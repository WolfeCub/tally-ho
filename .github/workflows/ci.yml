name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Don't use Cargo version. Crane names the dependency build
      # after the version in there i.e. tally-ho-deps-0.5.1. So
      # every release bump rebuilt all ~700 crates.
      - name: Release version
        id: meta
        if: github.ref_name == github.event.repository.default_branch
        run: |
          version=$(cat VERSION)
          # ghcr rejects uppercase, and owner names can have it.
          repository=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      # The check below inspects the manifest through the docker CLI, so it needs
      # a login rather than a token.
      - name: Log in to ghcr.io
        if: github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release is a version that isn't in the registry yet. Same version as
      # last time and there's nothing to release: we still build and test, but
      # pushing would drag :latest and an existing version tag onto a new commit.
      - name: Is the version already published?
        id: published
        if: github.ref_name == github.event.repository.default_branch
        uses: tyriis/docker-image-tag-exists@v3.0.1
        with:
          registry: ghcr.io
          repository: ${{ steps.meta.outputs.repository }}
          tag: ${{ steps.meta.outputs.version }}

      # nix-quick-install rather than install-nix-action: it's what
      # cache-nix-action is built against, and it needs the keep-* settings so GC
      # doesn't drop the things we're caching.
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - name: Cache the nix store
        id: cache
        uses: nix-community/cache-nix-action@v7
        with:
          # Keyed on the lockfiles, so a source-only change still reuses the
          # cached dependency build — nearly all of the ~700 crates. This file is
          # in there too: it decides what gets built, and a hit skips the save.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # 0 is "free whatever you can" — the action frees (store size - this).
          # GC can't touch anything an out-link reaches, so only dead paths go.
          gc-max-store-size: 0
          # Nothing to purge: we always restore the newest match, and GitHub drops
          # caches untouched for 7 days or evicts oldest-accessed past 10GB.

      - name: Cache state
        run: |
          echo "hit=${{ steps.cache.outputs.hit }}" \
               "primary=${{ steps.cache.outputs.hit-primary-key }}" \
               "first-match=${{ steps.cache.outputs.hit-first-match }}"
          echo "restored key: '${{ steps.cache.outputs.restored-key }}'"
          echo "store: $(du -sh /nix/store | cut -f1) in $(find /nix/store -mindepth 1 -maxdepth 1 | wc -l) paths"

      # The derivation's check phase runs the test suite, so this covers both.
      - name: Build image
        run: |
          nix build .#image -L
          # The push tooling has no gc-root of its own, so GC drops skopeo before
          # the save and every run rebuilds it from source. An out-link keeps it.
          nix build .#image.copyTo -o "$RUNNER_TEMP/push-tools" -L
          # Same story for the flake inputs, which are otherwise a 478MB nixpkgs
          # re-fetch every run.
          nix build .#flake-inputs -o "$RUNNER_TEMP/flake-inputs" -L

      # The size heading into the save. It is NOT the saved size: the GC and the
      # upload happen in cache-nix-action's post step, which runs after every step
      # here — those numbers are at the very end of the job log, under the
      # action's own "Post Cache the nix store".
      - name: Store size before save
        run: |
          echo "store: $(du -sh /nix/store | cut -f1) in $(find /nix/store -mindepth 1 -maxdepth 1 | wc -l) paths"
          df -h / | tail -1
          echo "--- 15 largest paths ---"
          du -sh /nix/store/* 2>/dev/null | sort -rh | head -15

      - name: Push to ghcr.io
        if: >-
          github.ref_name == github.event.repository.default_branch
          && steps.published.outputs.tag == 'not found'
        run: |
          # The runner ships a v1 /etc/containers/registries.conf, which the
          # skopeo from nixpkgs refuses to load. Point it at a v2 one instead.
          printf 'unqualified-search-registries = ["docker.io"]\n' > "$RUNNER_TEMP/registries.conf"
          export CONTAINERS_REGISTRIES_CONF="$RUNNER_TEMP/registries.conf"

          image="ghcr.io/${{ steps.meta.outputs.repository }}"
          # copyTo, not copyToRegistry — the latter hardcodes the destination to
          # the image's own name:tag, which isn't a registry path.
          for tag in "${{ steps.meta.outputs.version }}" "${{ github.sha }}" latest; do
            nix run .#image.copyTo -- \
              "docker://$image:$tag" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          done
